
name: EGX Investor Net Transactions

on:
  schedule:
    - cron: '*/5 8-14 * * 0-4'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egx-investor-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Run investor scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python script.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egx-debug-${{ github.run_number }}
          path: |
            sigma_page.html
            sigma_text.txt
            sigma_page.png
            sigma_network.txt
            sigma_error.txt
            egx_page.html
            egx_text.txt
            egx_page.png
            egx_network.txt
            egx_error.txt
          if-no-files-found: ignore
          retention-days: 7
